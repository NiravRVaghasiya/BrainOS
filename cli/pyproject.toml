[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainos-cli"
version = "1.1.0"
description = "Brain-inspired memory architecture plugins for AI agents."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Nirav Vaghasiya"}]
requires-python = ">=3.9"
keywords = ["ai", "memory", "agents", "rag", "llm", "cognitive-architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
all = [
    "numpy>=1.24",
    "sentence-transformers>=2.2",
    "chromadb>=0.4",
    "networkx>=3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
brainos = "brainos.cli:main"

[project.urls]
Homepage = "https://github.com/niravvaghasiya/BrainOS"
Repository = "https://github.com/niravvaghasiya/BrainOS"
