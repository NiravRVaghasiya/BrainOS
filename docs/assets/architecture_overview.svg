<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="BrainOS architecture overview: six plugin layers with top-to-bottom data flow and a modulation feedback loop">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="118%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E293B" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowDown" markerWidth="12" markerHeight="12" refX="6" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L6,9 L10,2" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowUp" markerWidth="12" markerHeight="12" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,10 L6,3 L10,10" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E293B">BrainOS Architecture</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#64748B">Six plugin layers &#183; data flows top &#8594; bottom &#183; modulation feeds back to storage</text>

  <!-- Column headers -->
  <text x="70" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">BRAIN REGION</text>
  <text x="730" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">AI EQUIVALENT</text>

  <!-- ================= LAYER 1: INPUT PROCESSING ================= -->
  <g>
    <rect x="150" y="112" width="500" height="96" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="172" y="150" font-size="14" font-weight="bold" fill="#1E293B">INPUT</text>
    <text x="172" y="168" font-size="14" font-weight="bold" fill="#1E293B">PROCESSING</text>
    <rect x="300" y="132" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="375" y="165" text-anchor="middle" font-size="13" fill="#1E293B">sensory-gate</text>
    <rect x="470" y="132" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="545" y="165" text-anchor="middle" font-size="13" fill="#1E293B">attention-filter</text>
    <text x="70" y="164" text-anchor="middle" font-size="12" fill="#64748B">Thalamus</text>
    <text x="730" y="164" text-anchor="middle" font-size="12" fill="#64748B">Preprocessing</text>
  </g>
  <line x1="400" y1="208" x2="400" y2="240" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ================= LAYER 2: ACTIVE CONTEXT ================= -->
  <g>
    <rect x="150" y="244" width="500" height="96" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="172" y="282" font-size="14" font-weight="bold" fill="#1E293B">ACTIVE</text>
    <text x="172" y="300" font-size="14" font-weight="bold" fill="#1E293B">CONTEXT</text>
    <rect x="385" y="264" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="460" y="297" text-anchor="middle" font-size="13" fill="#1E293B">working-memory</text>
    <text x="70" y="290" text-anchor="middle" font-size="12" fill="#64748B">Prefrontal</text>
    <text x="70" y="306" text-anchor="middle" font-size="12" fill="#64748B">Cortex</text>
    <text x="730" y="290" text-anchor="middle" font-size="12" fill="#64748B">Context</text>
    <text x="730" y="306" text-anchor="middle" font-size="12" fill="#64748B">Window</text>
  </g>
  <line x1="400" y1="340" x2="400" y2="372" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ================= LAYER 3: INDEXING ================= -->
  <g>
    <rect x="150" y="376" width="500" height="96" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="172" y="428" font-size="14" font-weight="bold" fill="#1E293B">INDEXING</text>
    <rect x="300" y="396" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="375" y="429" text-anchor="middle" font-size="13" fill="#1E293B">hippocampal-index</text>
    <rect x="470" y="396" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="545" y="429" text-anchor="middle" font-size="13" fill="#1E293B">consolidator</text>
    <text x="70" y="428" text-anchor="middle" font-size="12" fill="#64748B">Hippocampus</text>
    <text x="730" y="428" text-anchor="middle" font-size="12" fill="#64748B">Vector Store</text>
  </g>
  <line x1="400" y1="472" x2="400" y2="504" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ================= LAYER 4: LONG-TERM STORAGE ================= -->
  <g>
    <rect x="150" y="508" width="500" height="104" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="172" y="556" font-size="14" font-weight="bold" fill="#1E293B">LONG-TERM</text>
    <text x="172" y="574" font-size="14" font-weight="bold" fill="#1E293B">STORAGE</text>
    <rect x="290" y="530" width="118" height="60" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="349" y="565" text-anchor="middle" font-size="12" fill="#1E293B">episodic-store</text>
    <rect x="418" y="530" width="118" height="60" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="477" y="565" text-anchor="middle" font-size="12" fill="#1E293B">semantic-store</text>
    <rect x="546" y="530" width="94" height="60" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="593" y="558" text-anchor="middle" font-size="12" fill="#1E293B">procedural-</text>
    <text x="593" y="574" text-anchor="middle" font-size="12" fill="#1E293B">cache</text>
    <text x="70" y="564" text-anchor="middle" font-size="12" fill="#64748B">Neocortex</text>
    <text x="730" y="556" text-anchor="middle" font-size="12" fill="#64748B">Database</text>
    <text x="730" y="572" text-anchor="middle" font-size="12" fill="#64748B">/ KG</text>
  </g>
  <line x1="400" y1="612" x2="400" y2="644" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ================= LAYER 5: MODULATION ================= -->
  <g>
    <rect x="150" y="648" width="500" height="96" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="172" y="700" font-size="14" font-weight="bold" fill="#1E293B">MODULATION</text>
    <rect x="300" y="668" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <text x="375" y="701" text-anchor="middle" font-size="13" fill="#1E293B">salience-tagger</text>
    <rect x="470" y="668" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <text x="545" y="701" text-anchor="middle" font-size="13" fill="#1E293B">forgetting-engine</text>
    <text x="70" y="700" text-anchor="middle" font-size="12" fill="#64748B">Amygdala</text>
    <text x="730" y="700" text-anchor="middle" font-size="12" fill="#64748B">Scoring</text>
  </g>
  <line x1="400" y1="744" x2="400" y2="776" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- Feedback loop: Modulation -> Storage (upward, routed in right margin) -->
  <path d="M620,672 C695,656 695,600 646,572" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowUp)"/>
  <text x="700" y="624" text-anchor="middle" font-size="11" font-style="italic" fill="#F59E0B">feedback</text>

  <!-- ================= LAYER 6: META ================= -->
  <g>
    <rect x="150" y="780" width="500" height="96" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="172" y="832" font-size="14" font-weight="bold" fill="#1E293B">META</text>
    <rect x="300" y="800" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="375" y="833" text-anchor="middle" font-size="13" fill="#1E293B">dmn-incubator</text>
    <rect x="470" y="800" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="545" y="833" text-anchor="middle" font-size="13" fill="#1E293B">metacognition</text>
    <text x="70" y="832" text-anchor="middle" font-size="12" fill="#64748B">DMN</text>
    <text x="730" y="824" text-anchor="middle" font-size="12" fill="#64748B">Background</text>
    <text x="730" y="840" text-anchor="middle" font-size="12" fill="#64748B">Jobs</text>
  </g>
</svg>
