<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Information flow pipeline: encoding, consolidation, and retrieval pathways with timing annotations">
  <defs>
    <filter id="shadow2" x="-6%" y="-6%" width="112%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1E293B" flood-opacity="0.18"/>
    </filter>
    <marker id="flowArrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L9,6 L2,10" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="timeArrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,3 L10,7 L2,11" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1000" height="400" fill="#FFFFFF"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E293B">Information Flow: Encoding &#8594; Consolidation &#8594; Retrieval</text>

  <!-- ============ LANE 1: ENCODING (blue) ============ -->
  <rect x="20" y="60" width="440" height="250" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="40" y="84" font-size="14" font-weight="bold" fill="#1E293B">ENCODING</text>

  <rect x="40" y="110" width="86" height="48" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="83" y="139" text-anchor="middle" font-size="12" fill="#1E293B">Stimulus</text>

  <rect x="40" y="196" width="86" height="48" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="83" y="217" text-anchor="middle" font-size="11" fill="#1E293B">Sensory</text>
  <text x="83" y="231" text-anchor="middle" font-size="11" fill="#1E293B">Buffer</text>

  <rect x="188" y="196" width="86" height="48" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="231" y="217" text-anchor="middle" font-size="11" fill="#1E293B">Attention</text>
  <text x="231" y="231" text-anchor="middle" font-size="11" fill="#1E293B">Gate</text>

  <rect x="188" y="110" width="86" height="48" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="231" y="131" text-anchor="middle" font-size="11" fill="#1E293B">Working</text>
  <text x="231" y="145" text-anchor="middle" font-size="11" fill="#1E293B">Memory</text>

  <rect x="336" y="110" width="104" height="48" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="388" y="139" text-anchor="middle" font-size="12" fill="#1E293B">Hippocampus</text>

  <!-- encoding internal arrows -->
  <line x1="83" y1="158" x2="83" y2="194" stroke="#6B7280" stroke-width="2" marker-end="url(#flowArrow)"/>
  <line x1="126" y1="220" x2="186" y2="220" stroke="#6B7280" stroke-width="2" marker-end="url(#flowArrow)"/>
  <line x1="231" y1="194" x2="231" y2="160" stroke="#6B7280" stroke-width="2" marker-end="url(#flowArrow)"/>
  <line x1="274" y1="134" x2="334" y2="134" stroke="#6B7280" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- encoding timing -->
  <text x="83" y="178" text-anchor="middle" font-size="10" font-style="italic" fill="#3B82F6">200ms</text>
  <text x="231" y="178" text-anchor="middle" font-size="10" font-style="italic" fill="#3B82F6">30s</text>

  <!-- ============ LANE 2: CONSOLIDATION (purple) ============ -->
  <rect x="480" y="60" width="240" height="250" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="500" y="84" font-size="14" font-weight="bold" fill="#1E293B">CONSOLIDATION</text>

  <rect x="527" y="104" width="146" height="44" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="600" y="131" text-anchor="middle" font-size="12" fill="#1E293B">Hippocampus</text>
  <text x="690" y="130" text-anchor="middle" font-size="10" font-style="italic" fill="#8B5CF6">hours</text>

  <rect x="527" y="178" width="146" height="44" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="600" y="205" text-anchor="middle" font-size="12" fill="#1E293B">Sleep Replay</text>
  <text x="690" y="204" text-anchor="middle" font-size="10" font-style="italic" fill="#8B5CF6">days</text>

  <rect x="527" y="252" width="146" height="44" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="600" y="273" text-anchor="middle" font-size="11" fill="#1E293B">Cortical</text>
  <text x="600" y="287" text-anchor="middle" font-size="11" fill="#1E293B">Storage</text>
  <text x="690" y="278" text-anchor="middle" font-size="10" font-style="italic" fill="#8B5CF6">years</text>

  <line x1="600" y1="148" x2="600" y2="176" stroke="#6B7280" stroke-width="2" marker-end="url(#flowArrow)"/>
  <line x1="600" y1="222" x2="600" y2="250" stroke="#6B7280" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- ============ LANE 3: RETRIEVAL (green) ============ -->
  <rect x="740" y="60" width="240" height="250" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="760" y="84" font-size="14" font-weight="bold" fill="#1E293B">RETRIEVAL</text>

  <rect x="787" y="102" width="146" height="40" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="860" y="127" text-anchor="middle" font-size="12" fill="#1E293B">Cue</text>

  <rect x="787" y="150" width="146" height="40" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="860" y="175" text-anchor="middle" font-size="12" fill="#1E293B">Pattern Completion</text>

  <rect x="787" y="198" width="146" height="40" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="860" y="223" text-anchor="middle" font-size="12" fill="#1E293B">Reconstruction</text>

  <rect x="787" y="246" width="146" height="40" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="860" y="271" text-anchor="middle" font-size="12" fill="#1E293B">Conscious Recall</text>

  <line x1="860" y1="142" x2="860" y2="149" stroke="#6B7280" stroke-width="2" marker-end="url(#flowArrow)"/>
  <line x1="860" y1="190" x2="860" y2="197" stroke="#6B7280" stroke-width="2" marker-end="url(#flowArrow)"/>
  <line x1="860" y1="238" x2="860" y2="245" stroke="#6B7280" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- ===== inter-lane arrows ===== -->
  <line x1="440" y1="134" x2="525" y2="126" stroke="#6B7280" stroke-width="2.5" marker-end="url(#flowArrow)"/>
  <line x1="675" y1="274" x2="785" y2="170" stroke="#6B7280" stroke-width="2.5" marker-end="url(#flowArrow)"/>

  <!-- ===== timeline arrow at bottom ===== -->
  <line x1="40" y1="356" x2="960" y2="356" stroke="#94A3B8" stroke-width="2" marker-end="url(#timeArrow)"/>
  <text x="40" y="380" text-anchor="start" font-size="11" fill="#64748B">milliseconds</text>
  <text x="360" y="380" text-anchor="middle" font-size="11" fill="#64748B">seconds</text>
  <text x="600" y="380" text-anchor="middle" font-size="11" fill="#64748B">hours &#8594; years</text>
  <text x="860" y="380" text-anchor="middle" font-size="11" fill="#64748B">on recall (~1s)</text>
  <text x="978" y="352" text-anchor="end" font-size="11" font-weight="bold" fill="#64748B">time</text>
</svg>
